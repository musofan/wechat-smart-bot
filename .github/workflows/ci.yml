name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps (lean — mock suite, no torch/rapidocr)
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (critical rules only)
        run: python -m ruff check .
      - name: Test (mock suite, no live window)
        run: python -m pytest
